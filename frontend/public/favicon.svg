<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cx-grad-main" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="cx-glow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#cx-grad-main)" />

  <!-- Inner Glow Rim -->
  <rect x="5" y="5" width="54" height="54" rx="17" stroke="url(#cx-glow)" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Intersecting 'X' -->
  <path d="M19 19L45 45M45 19L19 45" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Hub -->
  <circle cx="32" cy="32" r="6" fill="#ffffff" />
  <circle cx="32" cy="32" r="2.8" fill="#7c3aed" />

  <!-- Corner Connection Nodes -->
  <circle cx="19" cy="19" r="3.2" fill="#ffffff" />
  <circle cx="45" cy="45" r="3.2" fill="#ffffff" />
  <circle cx="45" cy="19" r="3.2" fill="#ffffff" />
  <circle cx="19" cy="45" r="3.2" fill="#ffffff" />
</svg>